<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dunkles | Create account</title>
<link rel="icon" href="dunkles-logo-white.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<style>
  .accent-lines{position:absolute;inset:0;pointer-events:none;opacity:.7}
  .hline,.vline{position:absolute;background:#27272a;will-change:transform,opacity}
  .hline{left:0;right:0;height:1px;transform:scaleX(0);transform-origin:50% 50%;animation:drawX .8s cubic-bezier(.22,.61,.36,1) forwards}
  .vline{top:0;bottom:0;width:1px;transform:scaleY(0);transform-origin:50% 0%;animation:drawY .9s cubic-bezier(.22,.61,.36,1) forwards}
  .hline:nth-child(1){top:28%;animation-delay:.12s}
  .hline:nth-child(2){top:50%;animation-delay:.22s}
  .hline:nth-child(3){top:72%;animation-delay:.32s}
  .vline:nth-child(4){left:30%;animation-delay:.42s}
  .vline:nth-child(5){left:50%;animation-delay:.54s}
  .vline:nth-child(6){left:70%;animation-delay:.66s}
  .hline::after,.vline::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(250,250,250,.24),transparent);opacity:0;animation:shimmer .9s ease-out forwards}
  @keyframes drawX{0%{transform:scaleX(0);opacity:0}60%{opacity:.95}100%{transform:scaleX(1);opacity:.7}}
  @keyframes drawY{0%{transform:scaleY(0);opacity:0}60%{opacity:.95}100%{transform:scaleY(1);opacity:.7}}
  @keyframes shimmer{0%{opacity:0}35%{opacity:.25}100%{opacity:0}}
  .card-animate{opacity:0;transform:translateY(20px);animation:fadeUp .8s cubic-bezier(.22,.61,.36,1) .4s forwards}
  @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
  .ico{width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body class="bg-zinc-950 text-zinc-50">
<section class="fixed inset-0 overflow-y-auto">
  <div class="absolute inset-0 pointer-events-none" style="background:radial-gradient(80% 60% at 50% 70%,rgba(255,255,255,.06),transparent 60%)"></div>
  <div class="accent-lines">
    <div class="hline"></div><div class="hline"></div><div class="hline"></div>
    <div class="vline"></div><div class="vline"></div><div class="vline"></div>
  </div>
  <canvas id="fx" class="absolute inset-0 w-full h-full opacity-50 pointer-events-none" style="mix-blend-mode:screen"></canvas>

  <header class="absolute left-0 right-0 top-0 flex items-center justify-between px-6 py-4 border-b border-zinc-800/80 z-10">
    <a href="login.html" class="flex items-center gap-2">
      <img src="dunkles-logo-white.png" alt="" class="w-5 h-5 object-contain">
      <span class="text-xs tracking-[0.14em] uppercase text-zinc-400">dunkles</span>
    </a>
  </header>

  <div class="min-h-full w-full grid place-items-center px-4 py-24 relative">
    <div class="card-animate w-full max-w-sm rounded-lg border border-zinc-800 bg-zinc-900/70 backdrop-blur shadow-sm">
      <div class="flex flex-col space-y-1.5 p-6">
        <img src="dunkles-logo-white.png" alt="dunkles" class="w-10 h-10 object-contain mb-2">
        <h2 class="text-2xl font-semibold leading-none tracking-tight">Create your account</h2>
        <p class="text-sm text-zinc-400">Join dunkles in a few seconds. No credit card needed.</p>
      </div>

      <form id="form" class="grid gap-4 p-6 pt-0">
        <div class="grid gap-2">
          <label for="name" class="text-sm font-medium text-zinc-300">Full name</label>
          <div class="relative">
            <svg class="ico absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="name" type="text" required placeholder="Your name" class="h-9 w-full rounded-lg border border-zinc-800 bg-zinc-950 pl-10 pr-3 text-sm text-zinc-50 placeholder:text-zinc-600 outline-none focus:ring-[3px] focus:ring-zinc-50/20 focus:border-zinc-600">
          </div>
        </div>

        <div class="grid gap-2">
          <label for="email" class="text-sm font-medium text-zinc-300">Email</label>
          <div class="relative">
            <svg class="ico absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
            <input id="email" type="email" required placeholder="you@email.com" class="h-9 w-full rounded-lg border border-zinc-800 bg-zinc-950 pl-10 pr-3 text-sm text-zinc-50 placeholder:text-zinc-600 outline-none focus:ring-[3px] focus:ring-zinc-50/20 focus:border-zinc-600">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="grid gap-2">
            <label for="password" class="text-sm font-medium text-zinc-300">Password</label>
            <input id="password" type="password" required minlength="8" placeholder="Min. 8 characters" class="h-9 w-full rounded-lg border border-zinc-800 bg-zinc-950 px-3 text-sm text-zinc-50 placeholder:text-zinc-600 outline-none focus:ring-[3px] focus:ring-zinc-50/20 focus:border-zinc-600">
          </div>
          <div class="grid gap-2">
            <label for="confirm" class="text-sm font-medium text-zinc-300">Confirm</label>
            <input id="confirm" type="password" required placeholder="Repeat it" class="h-9 w-full rounded-lg border border-zinc-800 bg-zinc-950 px-3 text-sm text-zinc-50 placeholder:text-zinc-600 outline-none focus:ring-[3px] focus:ring-zinc-50/20 focus:border-zinc-600">
          </div>
        </div>

        <label class="flex items-start gap-2 text-sm text-zinc-400">
          <input id="terms" type="checkbox" required class="mt-0.5 h-4 w-4 rounded-sm border-zinc-700 bg-zinc-950 accent-zinc-50">
          <span>I agree to the <a href="legal.html#terms" target="_blank" class="text-zinc-200 hover:underline">Terms</a> and <a href="legal.html#privacy" target="_blank" class="text-zinc-200 hover:underline">Privacy Policy</a></span>
        </label>

        <p id="err" class="text-xs text-red-400 hidden"></p>
        <p id="ok" class="text-xs text-emerald-400 hidden"></p>
        <div id="codebox" class="hidden grid gap-2">
          <label for="code" class="text-sm font-medium text-zinc-300">Verification code</label>
          <div class="flex gap-2">
            <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Enter the code" class="h-9 flex-1 min-w-0 rounded-lg border border-zinc-800 bg-zinc-950 px-3 text-sm tracking-widest text-zinc-50 placeholder:text-zinc-600 placeholder:tracking-normal outline-none focus:ring-[3px] focus:ring-zinc-50/20 focus:border-zinc-600">
            <button id="verify" type="button" class="h-9 px-4 rounded-lg bg-zinc-50 text-zinc-900 text-sm font-medium hover:bg-zinc-200">Verify</button>
          </div>
        </div>

        <button type="submit" class="w-full h-10 rounded-lg bg-zinc-50 text-zinc-900 text-sm font-medium hover:bg-zinc-200 transition-colors">Create account</button>

        <div class="relative">
          <div class="h-px w-full bg-zinc-800"></div>
          <span class="absolute left-1/2 -translate-x-1/2 -top-2 bg-zinc-900 px-2 text-[11px] uppercase tracking-widest text-zinc-500">or</span>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button type="button" data-provider="github" class="h-10 rounded-lg border border-zinc-800 bg-zinc-950 text-sm hover:bg-zinc-900/80 flex items-center justify-center gap-2">
            <svg class="ico" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65S8.93 17.38 9 18v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>GitHub
          </button>
          <button type="button" data-provider="google" class="h-10 rounded-lg border border-zinc-800 bg-zinc-950 text-sm hover:bg-zinc-900/80 flex items-center justify-center gap-2">
            <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><path d="M21.17 8H12M3.95 6.06 8.54 14M10.88 21.94 15.46 14"/></svg>Google
          </button>
        </div>
      </form>

      <div class="flex flex-col items-center gap-3 p-6 pt-0 text-sm text-zinc-400">
        <div>Already have an account? <a class="ml-1 text-zinc-200 hover:underline" href="login.html">Sign in</a></div>
      </div>
    </div>
  </div>
</section>

<script>
const A = window.dunklesAuth;
const err = document.getElementById('err');
const ok = document.getElementById('ok');
const showErr = t => { ok.classList.add('hidden'); err.textContent = t; err.classList.remove('hidden'); };
const NOT_READY = 'Sign-up is not configured yet. Add your Supabase keys in auth.js.';

if (A.configured) A.session().then(s => { if (s) location.replace('index.html'); });

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  err.classList.add('hidden'); ok.classList.add('hidden');
  if (!A.configured) return showErr(NOT_READY);
  if (document.getElementById('password').value !== document.getElementById('confirm').value) {
    return showErr('Passwords do not match.');
  }
  const { data, error } = await A.client.auth.signUp({
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    options: {
      data: { full_name: document.getElementById('name').value },
      emailRedirectTo: A.home(),
    },
  });
  if (error) return showErr(error.message);
  if (data.session) { location.href = 'index.html'; return; }
  // Email confirmation is on: ask for the code we just emailed.
  pendingEmail = document.getElementById('email').value;
  ok.textContent = 'We sent a verification code to ' + pendingEmail + '. Enter it below.';
  ok.classList.remove('hidden');
  document.getElementById('codebox').classList.remove('hidden');
  document.getElementById('code').focus();
});

let pendingEmail = '';
document.getElementById('verify').addEventListener('click', async () => {
  err.classList.add('hidden');
  const token = document.getElementById('code').value.trim();
  if (!token) return showErr('Enter the code from your email.');
  const { error } = await A.client.auth.verifyOtp({ email: pendingEmail, token, type: 'signup' });
  if (error) return showErr(error.message);
  location.href = 'index.html';
});

document.querySelectorAll('[data-provider]').forEach(btn => {
  btn.addEventListener('click', async () => {
    err.classList.add('hidden');
    if (!A.configured) return showErr(NOT_READY);
    const { error } = await A.oauth(btn.dataset.provider);
    if (error) showErr(error.message);
  });
});

// Particle animation
const c = document.getElementById('fx'), ctx = c.getContext('2d');
let ps = [];
const make = () => ({x:Math.random()*c.width, y:Math.random()*c.height, v:Math.random()*.25+.05, o:Math.random()*.35+.15});
function init(){
  c.width = innerWidth; c.height = innerHeight;
  ps = Array.from({length: Math.floor(c.width*c.height/9000)}, make);
}
function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  for (const p of ps){
    p.y -= p.v;
    if (p.y < 0){ p.x=Math.random()*c.width; p.y=c.height+Math.random()*40; p.v=Math.random()*.25+.05; p.o=Math.random()*.35+.15; }
    ctx.fillStyle = `rgba(250,250,250,${p.o})`;
    ctx.fillRect(p.x,p.y,.7,2.2);
  }
  requestAnimationFrame(draw);
}
addEventListener('resize', init);
init(); draw();
</script>
</body>
</html>
